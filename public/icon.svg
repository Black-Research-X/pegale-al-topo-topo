<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
  </defs>
  <!-- Full-bleed rounded background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />
  <!-- Lawn strip at bottom -->
  <path d="M 0 360 Q 256 320 512 360 L 512 512 L 0 512 Z" fill="url(#grassGrad)" />
  <!-- Dirt mound -->
  <ellipse cx="256" cy="395" rx="165" ry="52" fill="#291206" />
  <ellipse cx="256" cy="382" rx="135" ry="34" fill="#0f0703" />
  <!-- Mole ears -->
  <circle cx="164" cy="222" r="34" fill="#92400e" stroke="#451a03" stroke-width="8" />
  <circle cx="164" cy="222" r="18" fill="#f472b6" />
  <circle cx="348" cy="222" r="34" fill="#92400e" stroke="#451a03" stroke-width="8" />
  <circle cx="348" cy="222" r="18" fill="#f472b6" />
  <!-- Mole body & head -->
  <path d="M 146 382 C 146 210 180 146 256 146 C 332 146 366 210 366 382 Z" fill="#b45309" stroke="#451a03" stroke-width="10" />
  <!-- Green Cap -->
  <path d="M 164 185 Q 256 85 348 185 Z" fill="#16a34a" stroke="#14532d" stroke-width="8" />
  <rect x="148" y="176" width="216" height="28" rx="14" fill="#22c55e" stroke="#14532d" stroke-width="8" />
  <text x="256" y="162" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="900" fill="#ffffff">M</text>
  <!-- Eyes -->
  <ellipse cx="216" cy="242" rx="18" ry="24" fill="#0f172a" />
  <circle cx="210" cy="233" r="7" fill="#ffffff" />
  <ellipse cx="296" cy="242" rx="18" ry="24" fill="#0f172a" />
  <circle cx="290" cy="233" r="7" fill="#ffffff" />
  <!-- Rosy cheeks -->
  <ellipse cx="182" cy="276" rx="18" ry="11" fill="#f43f5e" opacity="0.6" />
  <ellipse cx="330" cy="276" rx="18" ry="11" fill="#f43f5e" opacity="0.6" />
  <!-- Snout -->
  <ellipse cx="256" cy="290" rx="58" ry="38" fill="#fed7aa" stroke="#78350f" stroke-width="6" />
  <ellipse cx="256" cy="274" rx="22" ry="15" fill="#db2777" />
  <ellipse cx="250" cy="270" rx="7" ry="4" fill="#ffffff" opacity="0.8" />
  <!-- Teeth -->
  <rect x="242" y="302" width="13" height="20" rx="3" fill="#ffffff" stroke="#78350f" stroke-width="3" />
  <rect x="257" y="302" width="13" height="20" rx="3" fill="#ffffff" stroke="#78350f" stroke-width="3" />
  <!-- Wooden Mallet -->
  <g transform="rotate(-24 395 215)">
    <rect x="382" y="210" width="26" height="145" rx="12" fill="#d97706" stroke="#451a03" stroke-width="8" />
    <rect x="336" y="138" width="118" height="78" rx="20" fill="#78350f" stroke="#451a03" stroke-width="9" />
    <rect x="356" y="138" width="16" height="78" fill="#fbbf24" opacity="0.85" />
    <rect x="418" y="138" width="16" height="78" fill="#fbbf24" opacity="0.85" />
  </g>
</svg>
